<!DOCTYPE html>
<html>
<head>
  <title>Job Search | Indeed</title>
</head>
<body>
  <!-- Homepage /?vjk= shell. There is no #jobDescriptionText and no view-job
       pane. The first .jobsearch-JobComponent is a feed card. Its
       .jobsearch-JobComponent-description is a short, specific snippet.
       Scoring that snippet used to emit both "Very short job description"
       and "Detailed, specific job description". The full JD is only in the
       mosaic viewJob model. -->
  <div class="jobsearch-JobComponent">
    <div class="jobsearch-JobComponent-description">$230,000 - $250,000 a year. Reports to the CMO. 8+ years of marketing.</div>
    <div id="salaryInfoAndJobType">$230,000 - $250,000 a year</div>
    <button id="apply-button">Apply on company site</button>
  </div>
  <script id="__stj_mosaic" type="application/json">{
    "jobs": [{
      "jobkey": "bdcf974325e2454e",
      "displayTitle": "Head of Marketing",
      "title": "Head of Marketing",
      "company": "Inato",
      "formattedRelativeTime": "45 days ago",
      "salarySnippet": { "text": "$230,000 - $250,000 a year" }
    }],
    "viewJob": {
      "jobkey": "bdcf974325e2454e",
      "title": "Head of Marketing",
      "company": "Inato",
      "location": "United States",
      "formattedRelativeTime": "45 days ago",
      "salaryText": "$230,000 - $250,000 a year",
      "description": "Inato is hiring a Head of Marketing to own campaign strategy, lifecycle programs, and the public site. You will report to the CMO and lead a team of 8 marketers. The stack includes HubSpot, Salesforce, and a modern analytics warehouse. Compensation is $230,000 - $250,000 a year. This role requires 8+ years of B2B marketing experience, including ownership of pipeline targets and a documented content system. You will write the annual plan, hire two managers, and present results to the board each quarter. The description continues with concrete deliverables: a messaging hierarchy, a campaign calendar, experiment readouts, and a hiring plan for the brand studio. You will partner with product marketing on launch briefs and with sales on enablement. This posting is the full job description, long enough that a loaded Indeed description is not treated as a short snippet from the homepage feed card."
    }
  }</script>
</body>
</html>
